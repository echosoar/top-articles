<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Top Articles</title>
<style>
:root{--text:rgba(0,0,0,.88);--strong:#000;--muted:rgba(0,0,0,.55);--faint:rgba(0,0,0,.35);--line:rgba(0,0,0,.12);--soft:rgba(0,0,0,.07)}
*{box-sizing:border-box}
body{min-width:320px;margin:0;background:#fff;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
main{width:min(100%,1440px);margin:0 auto;padding:72px 48px 56px}
header{display:flex;align-items:end;justify-content:space-between;gap:32px;margin-bottom:48px}
h1{margin:0;color:var(--strong);font-size:32px;font-weight:650;letter-spacing:-.03em}
.description,#status{margin:12px 0 0;color:var(--muted);font-size:14px}
#status{margin:0;white-space:nowrap}
.table-wrap{overflow-x:auto}
table{width:100%;min-width:1000px;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:18px 14px;text-align:left;vertical-align:middle;white-space:nowrap}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
th{border-bottom:1px solid var(--line);color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.055em}
td{border-bottom:1px solid var(--soft)}
td.title{white-space:normal;min-width:260px}
.sort-button{display:inline-flex;align-items:center;gap:7px;padding:0;border:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer}
.sort-button::after{content:"↕";font-size:13px}
.sort-button[aria-sort=ascending]::after{color:var(--strong);content:"↑"}
.sort-button[aria-sort=descending]::after{color:var(--strong);content:"↓"}
a{color:var(--strong);text-decoration:none}
a:hover{text-decoration:underline}
.score{font-weight:650;color:var(--strong)}
.origin-title{margin-top:4px;color:var(--faint);font-size:12px}
#filters{display:flex;flex-wrap:wrap;gap:8px;margin:-16px 0 32px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--strong);background:var(--strong);color:#fff}
.chip span{margin-left:6px;opacity:.6}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
a.chip:hover{text-decoration:none;border-color:var(--strong);color:var(--strong)}
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.4)}
.modal.open{display:flex}
.modal-box{width:min(100%,960px);max-height:90vh;overflow:auto;padding:28px 32px;border-radius:12px;background:#fff}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-head h2{margin:0;font-size:20px;font-weight:650}
.modal-close{border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;cursor:pointer}
.rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.rank-grid h3{margin:0 0 8px;font-size:15px}
.rank-table{min-width:0;font-size:13px}
.rank-table th,.rank-table td{padding:10px 8px;white-space:normal}
.rank-table th:first-child,.rank-table td:first-child{padding-left:0;width:36px;color:var(--faint)}
.rank-table th:last-child,.rank-table td:last-child{text-align:right;padding-right:0}
.month-table th:first-child,.month-table td:first-child{width:auto}
.month-table td:first-child{color:var(--text)}
@media(max-width:700px){main{padding:40px 20px}header{flex-direction:column;align-items:start}.side{align-items:flex-start}.rank-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
<div><h1>Top Articles</h1><p class="description">热门互联网 10w+ 文章（无新闻、宣传、公告等类型）</p></div>
<div class="side"><p id="status">加载中…</p></div>
</header>
<div class="modal" id="rank-modal" role="dialog" aria-modal="true" aria-label="统计">
<div class="modal-box">
<div class="modal-head"><h2>统计</h2><button class="modal-close" id="rank-close" type="button" aria-label="关闭">×</button></div>
<div class="rank-grid">
<div><h3>上榜次数</h3><table class="rank-table"><thead><tr><th>#</th><th>作者</th><th>次数</th></tr></thead><tbody id="rank-count"></tbody></table></div>
<div><h3>平均点赞量(万)</h3><table class="rank-table"><thead><tr><th>#</th><th>作者</th><th>平均点赞(万)</th></tr></thead><tbody id="rank-likes"></tbody></table></div>
<div><h3>平均转发量(万)</h3><table class="rank-table"><thead><tr><th>#</th><th>作者</th><th>平均转发(万)</th></tr></thead><tbody id="rank-shares"></tbody></table></div>
<div><h3>按月文章数量</h3><table class="rank-table month-table"><thead><tr><th>月份</th><th>文章数量</th></tr></thead><tbody id="rank-month"></tbody></table></div>
</div>
</div>
</div>
<div id="filters"><span id="filter-chips" style="display:contents"></span><button class="chip" id="rank-btn" type="button">统计</button><a class="chip" href="https://github.com/echosoar/top-articles/issues/new" target="_blank" rel="noopener noreferrer">提交文章收录</a></div>
<div class="table-wrap"><table>
<thead><tr id="head"></tr></thead>
<tbody id="body"></tbody>
</table></div>
<div style="display: flex; align-items: center; gap: 8px;font-size: 12px;">
  <a style="color: rgb(83, 125, 249)" href="https://aiznb.com">AIZNB</a> <span style="opacity: .5;">|</span> <img style="height: 16px;width: auto;margin: 12px 0;" src="https://not.aiznb.com/img?style=today&amp;url=https://aiznb.com/top-articles/">
</div>
</main>
<script>
const CHANNELS = { wechat: "微信公众号" };
const COLS = [
  { key: "score", label: "评分", sort: true },
  { key: "title", label: "标题" },
  { key: "channel", label: "渠道" },
  { key: "category", label: "分类" },
  { key: "author", label: "作者" },
  { key: "reads", label: "阅读(万)", sort: true },
  { key: "likes", label: "点赞(万)", sort: true },
  { key: "shares", label: "转发(万)", sort: true },
  { key: "publishTime", label: "发布时间", sort: true },
];
const defaultScore = (a) => {
  const timeDiff = calcTimeDiff(a.publishTime);
  const res = Math.round(((a.reads || 0) + (a.likes || 0) * 3 + (a.shares || 0) * 5) * 100) / 500 ;
  if (res < 0.1) {
    return 0.1;
  }
  return res *timeDiff
};
const min =  Date.parse("2010/01/01");// 2020-01-01
 
const calcTimeDiff = (publishTime) => {
  const diff = Date.now() - (Date.parse(publishTime) || 0);
  const pi = 1 - diff / (Date.now() - min);
  if (pi <= 0.1) {
    return 0.1;
  }
  return pi * pi;
}

const xScore = (a) => {
  const timeDiff = calcTimeDiff(a.publishTime);
  const read = a.reads > 10000 ? 10000 : a.reads; 
  const res = Math.round((Math.sqrt(read / 2) / 2 + (a.likes || 0)    + (a.shares || 0) * 4) * 100) / 500;
  if (res < 0.1) {
    return 0.1;
  }
  return res * timeDiff
};
// 按平台（channel）自定义评分逻辑，未配置的平台使用 defaultScore
const scoreByPlatform = {
  X: (a) => xScore(a),
  // 公众号: (a) => defaultScore(a),
};
const score = (a) => (scoreByPlatform[a.channel] || defaultScore)(a);
let rows = [], sortKey = "score", dir = -1;
const selected = new Set();
const filters = document.getElementById("filter-chips");
const head = document.getElementById("head"), body = document.getElementById("body"), status = document.getElementById("status");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }

function renderHead() {
  head.innerHTML = "";
  for (const c of COLS) {
    const th = document.createElement("th");
    if (c.sort) {
      const b = document.createElement("button");
      b.className = "sort-button";
      b.textContent = c.label;
      b.setAttribute("aria-sort", sortKey === c.key ? (dir > 0 ? "ascending" : "descending") : "none");
      b.onclick = () => { if (sortKey === c.key) dir = -dir; else { sortKey = c.key; dir = -1; } render(); };
      th.appendChild(b);
    } else th.textContent = c.label;
    head.appendChild(th);
  }
  const th = document.createElement("th"); th.textContent = "链接"; head.appendChild(th);
}

function renderFilters() {
  const counts = new Map();
  for (const r of rows) counts.set(r.channel, (counts.get(r.channel) || 0) + 1);
  filters.innerHTML = "";
  for (const [ch, n] of [...counts].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])))) {
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", selected.has(ch));
    b.append(CHANNELS[ch] || ch || "未知");
    const s = document.createElement("span"); s.textContent = n; b.appendChild(s);
    b.onclick = () => { selected.has(ch) ? selected.delete(ch) : selected.add(ch); renderFilters(); render(); };
    filters.appendChild(b);
  }
}

function render() {
  const val = (r) => sortKey === "publishTime" ? Date.parse(r.publishTime) || 0 : r[sortKey] || 0;
  rows.sort((a, b) => (val(a) - val(b)) * dir);
  renderHead();
  const shown = selected.size ? rows.filter((r) => selected.has(r.channel)) : rows;
  body.innerHTML = shown.map((r) => {
    const url = safeUrl(r.url);
    return `<tr><td class="score">${r.score.toFixed(2)}</td><td class="title">${esc(r.title)}${r.originTitle ? `<div class="origin-title">${esc(r.originTitle)}</div>` : ""}</td>` +
      `<td>${esc(CHANNELS[r.channel] || r.channel)}</td><td>${esc(r.category)}</td><td>${esc(r.author)}</td>` +
      `<td>${esc(r.reads)}</td><td>${esc(r.likes)}</td><td>${esc(r.shares)}</td>` +
      `<td>${esc(r.publishTime)}</td>` +
      `<td>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看</a>` : ""}</td></tr>`;
  }).join("");
  status.textContent = `${shown.length} 篇文章`;
}

const rankModal = document.getElementById("rank-modal");
function renderRank() {
  const stat = new Map();
  const monthCounts = new Map();
  for (const r of rows) {
    const name = r.author || "未知";
    const s = stat.get(name) || { count: 0, likes: 0, shares: 0 };
    s.count++; s.likes += Number(r.likes) || 0; s.shares += Number(r.shares) || 0;
    stat.set(name, s);
    const date = new Date(r.publishTime);
    if (!Number.isNaN(date.getTime())) {
      const month = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      monthCounts.set(month, (monthCounts.get(month) || 0) + 1);
    }
  }
  const topCount = [...stat].sort((a, b) => b[1].count - a[1].count).slice(0, 20);
  const topAverage = (key) => [...stat]
    .filter(([, s]) => s.count >= 3)
    .map(([name, s]) => [name, s[key] / s.count])
    .sort((a, b) => b[1] - a[1])
    .slice(0, 20);
  const htmlCount = topCount.map(([n, s], i) => `<tr><td>${i + 1}</td><td>${esc(n)}</td><td>${s.count}</td></tr>`).join("");
  const htmlAverage = (list) => list.map(([name, average], i) => `<tr><td>${i + 1}</td><td>${esc(name)}</td><td>${Math.round(average * 100) / 100}</td></tr>`).join("");
  const now = new Date();
  const months = Array.from({ length: 21 }, (_, offset) => {
    const date = new Date(now.getFullYear(), now.getMonth() - offset, 1);
    const month = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    return `<tr><td>${month}</td><td>${monthCounts.get(month) || 0}</td></tr>`;
  }).join("");
  document.getElementById("rank-count").innerHTML = htmlCount;
  document.getElementById("rank-likes").innerHTML = htmlAverage(topAverage("likes"));
  document.getElementById("rank-shares").innerHTML = htmlAverage(topAverage("shares"));
  document.getElementById("rank-month").innerHTML = months;
}
document.getElementById("rank-btn").onclick = () => { renderRank(); rankModal.classList.add("open"); };
document.getElementById("rank-close").onclick = () => rankModal.classList.remove("open");
rankModal.onclick = (e) => { if (e.target === rankModal) rankModal.classList.remove("open"); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") rankModal.classList.remove("open"); });

fetch("data.json").then((r) => r.json()).then((d) => {
  rows = d.map((a) => ({ ...a, score: score(a) }));
  renderFilters();
  render();
}).catch(() => { status.textContent = "加载失败"; });
</script>
</body>
</html>
